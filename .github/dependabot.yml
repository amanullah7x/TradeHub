version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
  # Expo pins compatible versions of its packages per SDK, so only security fixes are proposed here.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
